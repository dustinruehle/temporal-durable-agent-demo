<svg viewBox="0 0 1000 376" role="img" aria-label="Timeline: the session starts with no Worker; Temporal starts a Worker that makes the model call and arms a 90-second follow-up at about 17 s; the Worker drains at about 32 s; nothing runs until the Timer fires at 107.5 s; Temporal starts a Worker again and the follow-up is sent at 110.6 s." xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;background:#FFFFFF;border-radius:10px"><text x="24" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1C1526" text-anchor="start">A live run: a 90-second follow-up, AgentCore drain window 15 s</text><text x="24" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5F5B68" text-anchor="start">Worker running</text><rect x="70.0" y="70" width="234.66666666666663" height="22" rx="5" fill="#E5F3EB" stroke="#1F7A4D"/><rect x="858.3333333333334" y="70" width="91.66666666666663" height="22" rx="5" fill="#E5F3EB" stroke="#1F7A4D"/><rect x="304.66666666666663" y="70" width="553.6666666666667" height="22" rx="5" fill="#F7F6F3" stroke="#DCD8E0" stroke-dasharray="5 4"/><text x="583.3333333333334" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5F5B68" text-anchor="middle">zero Workers, zero microVMs busy</text><line x1="70" y1="150" x2="950" y2="150" stroke="#1C1526" stroke-width="1.5"/><line x1="70.0" y1="146" x2="70.0" y2="154" stroke="#1C1526"/><text x="70.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">0s</text><line x1="180.0" y1="146" x2="180.0" y2="154" stroke="#1C1526"/><text x="180.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">15s</text><line x1="290.0" y1="146" x2="290.0" y2="154" stroke="#1C1526"/><text x="290.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">30s</text><line x1="400.0" y1="146" x2="400.0" y2="154" stroke="#1C1526"/><text x="400.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">45s</text><line x1="510.0" y1="146" x2="510.0" y2="154" stroke="#1C1526"/><text x="510.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">60s</text><line x1="620.0" y1="146" x2="620.0" y2="154" stroke="#1C1526"/><text x="620.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">75s</text><line x1="730.0" y1="146" x2="730.0" y2="154" stroke="#1C1526"/><text x="730.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">90s</text><line x1="840.0" y1="146" x2="840.0" y2="154" stroke="#1C1526"/><text x="840.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">105s</text><line x1="950.0" y1="146" x2="950.0" y2="154" stroke="#1C1526"/><text x="950.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5B68" text-anchor="middle">120s</text><line x1="70.0" y1="150" x2="70.0" y2="282" stroke="#4B3FD1" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="70.0" cy="150" r="5" fill="#4B3FD1"/><text x="76.0" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#4B3FD1" text-anchor="start">session starts</text><text x="76.0" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="start">no Worker anywhere</text><line x1="147.73333333333335" y1="150" x2="147.73333333333335" y2="232" stroke="#1F7A4D" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="147.73333333333335" cy="150" r="5" fill="#1F7A4D"/><text x="153.73333333333335" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#1F7A4D" text-anchor="start">model call</text><text x="153.73333333333335" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="start">Temporal started a Worker</text><line x1="193.2" y1="150" x2="193.2" y2="128" stroke="#4B3FD1" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="193.2" cy="150" r="5" fill="#4B3FD1"/><text x="199.2" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#4B3FD1" text-anchor="start">follow-up armed</text><text x="199.2" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="start">durable Timer, 90 s</text><line x1="304.66666666666663" y1="150" x2="304.66666666666663" y2="182" stroke="#5F5B68" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="304.66666666666663" cy="150" r="5" fill="#5F5B68"/><text x="310.66666666666663" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#5F5B68" text-anchor="start">Worker drains</text><text x="310.66666666666663" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="start">15 s idle, returns</text><line x1="858.3333333333334" y1="150" x2="858.3333333333334" y2="232" stroke="#C2412D" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="858.3333333333334" cy="150" r="5" fill="#C2412D"/><text x="852.3333333333334" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#C2412D" text-anchor="end">Timer fires</text><text x="852.3333333333334" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="end">a new Workflow Task</text><line x1="881.0666666666667" y1="150" x2="881.0666666666667" y2="282" stroke="#1F7A4D" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="881.0666666666667" cy="150" r="5" fill="#1F7A4D"/><text x="875.0666666666667" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#1F7A4D" text-anchor="end">follow-up sent</text><text x="875.0666666666667" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="end">Worker started again</text><text x="24" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1C1526" text-anchor="start">Event History on the session: TimerStarted at about 17 s, TimerFired at 107.5 s, then invoke_model and</text><text x="24" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1C1526" text-anchor="start">send_customer_message, both run by a Worker that did not exist when the Timer was set.</text></svg>