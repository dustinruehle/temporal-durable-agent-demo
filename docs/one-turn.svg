<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="One turn: a customer message reaches Temporal by Signal-With-Start, the Worker runs the Workflow, the invoke_model Activity calls the model, a tool Activity runs, each result is recorded in Event History, and the reply is read by a Query.">
  <title>One turn of the agent session</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9C2D6"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A68BEE"/>
    </marker>
    <style>
      .h1{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:600;fill:#ECE8F3}
      .sub{font-size:17px;fill:#B1A9C2}
      .eyebrow{font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;letter-spacing:1.5px;fill:#A68BEE}
      .who{font-size:17px;font-weight:600;fill:#ECE8F3}
      .whos{font-size:13px;fill:#B1A9C2}
      .lab{font-size:14px;fill:#ECE8F3}
      .labv{font-size:14px;fill:#C9B8F5}
      .num{font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;font-weight:700;fill:#15111D}
      .note{font-size:13px;fill:#B1A9C2}
      .ok{font-size:15px;font-weight:600;fill:#5FBE97}
      .mono{font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;fill:#E9B23A}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#15111D"/>

  <text x="48" y="58" class="h1">One turn of the agent session</text>
  <text x="48" y="90" class="sub">Every model call and tool call is an Activity. Each result lands in Event History before the next step starts.</text>

  <!-- regions -->
  <rect x="40" y="116" width="1060" height="700" rx="14" fill="#1A1524" stroke="#4A4060" stroke-width="2"/>
  <text x="62" y="140" class="eyebrow">YOUR MACHINE OR YOUR AWS ACCOUNT</text>
  <rect x="1130" y="116" width="430" height="700" rx="14" fill="#1E1530" stroke="#8E6BE6" stroke-width="2"/>
  <text x="1152" y="140" class="eyebrow">TEMPORAL · YOUR NAMESPACE</text>

  <!-- lifeline heads -->
  <rect x="70" y="156" width="220" height="56" rx="8" fill="#1E1828" stroke="#5A5368"/>
  <text x="180" y="181" text-anchor="middle" class="who">Gateway and dashboard</text>
  <text x="180" y="200" text-anchor="middle" class="whos">:8090 and :8080</text>
  <rect x="340" y="156" width="220" height="56" rx="8" fill="#1E1828" stroke="#5A5368"/>
  <text x="450" y="181" text-anchor="middle" class="who">Model</text>
  <text x="450" y="200" text-anchor="middle" class="whos">Amazon Bedrock (or mock)</text>
  <rect x="630" y="156" width="260" height="56" rx="8" fill="#2A1A1E" stroke="#F0805E" stroke-width="2"/>
  <text x="760" y="181" text-anchor="middle" class="who">Worker</text>
  <text x="760" y="200" text-anchor="middle" class="whos">runs Workflow and Activity code</text>
  <rect x="1195" y="156" width="300" height="56" rx="8" fill="#2A2140" stroke="#8E6BE6" stroke-width="1.5"/>
  <text x="1345" y="181" text-anchor="middle" class="who">Session Workflow</text>
  <text x="1345" y="200" text-anchor="middle" class="whos">Event History and Task Queues</text>

  <!-- lifelines -->
  <line x1="180" y1="212" x2="180" y2="800" stroke="#5A5368" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="450" y1="212" x2="450" y2="800" stroke="#5A5368" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="760" y1="212" x2="760" y2="800" stroke="#F0805E" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="1345" y1="212" x2="1345" y2="800" stroke="#8E6BE6" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- 1 -->
  <line x1="180" y1="262" x2="1341" y2="262" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="214" cy="244" r="11" fill="#E9B23A"/><text x="214" y="249" text-anchor="middle" class="num">1</text>
  <text x="234" y="249" class="lab">Signal-With-Start: Workflow Id = conversation id, Signal deliver_message(text)</text>

  <!-- 2 -->
  <line x1="1345" y1="316" x2="764" y2="316" stroke="#A68BEE" stroke-width="2.5" marker-end="url(#av)"/>
  <circle cx="1315" cy="298" r="11" fill="#E9B23A"/><text x="1315" y="303" text-anchor="middle" class="num">2</text>
  <text x="792" y="303" class="labv">Workflow Task from agent-session</text>
  <rect x="776" y="330" width="230" height="34" rx="6" fill="#1E1828" stroke="#5A5368"/>
  <text x="788" y="352" class="mono">agent.invoke_async(text)</text>

  <!-- 3 -->
  <line x1="760" y1="396" x2="1341" y2="396" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="790" cy="380" r="11" fill="#E9B23A"/><text x="790" y="385" text-anchor="middle" class="num">3</text>
  <text x="810" y="385" class="lab">Schedule invoke_model on model-calls</text>

  <!-- 4 -->
  <line x1="1345" y1="446" x2="764" y2="446" stroke="#A68BEE" stroke-width="2.5" marker-end="url(#av)"/>
  <circle cx="1315" cy="430" r="11" fill="#E9B23A"/><text x="1315" y="435" text-anchor="middle" class="num">4</text>
  <text x="792" y="435" class="labv">Activity Task from model-calls</text>

  <!-- 5 -->
  <line x1="760" y1="494" x2="454" y2="494" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="732" cy="478" r="11" fill="#E9B23A"/><text x="732" y="483" text-anchor="middle" class="num">5</text>
  <text x="476" y="483" class="lab">Model call (Bedrock or mock)</text>
  <line x1="450" y1="528" x2="756" y2="528" stroke="#C9C2D6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="476" y="520" class="lab">tool_use: check_inventory</text>

  <!-- 6 -->
  <line x1="760" y1="576" x2="1341" y2="576" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="790" cy="560" r="11" fill="#E9B23A"/><text x="790" y="565" text-anchor="middle" class="num">6</text>
  <text x="810" y="565" class="lab">Model result into Event History</text>

  <!-- 7 -->
  <line x1="760" y1="632" x2="1341" y2="632" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="790" cy="614" r="11" fill="#E9B23A"/><text x="790" y="619" text-anchor="middle" class="num">7</text>
  <text x="810" y="619" class="lab">check_inventory on agent-session; recorded</text>

  <!-- 8 -->
  <line x1="760" y1="684" x2="454" y2="684" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="732" cy="668" r="11" fill="#E9B23A"/><text x="732" y="673" text-anchor="middle" class="num">8</text>
  <text x="476" y="673" class="lab">invoke_model with the tool result</text>
  <line x1="450" y1="716" x2="756" y2="716" stroke="#C9C2D6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="476" y="708" class="lab">reply text</text>

  <!-- 9 -->
  <line x1="760" y1="756" x2="1341" y2="756" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="790" cy="740" r="11" fill="#E9B23A"/><text x="790" y="745" text-anchor="middle" class="num">9</text>
  <text x="810" y="745" class="lab">Reply recorded; the Workflow waits</text>

  <!-- 10 -->
  <line x1="180" y1="796" x2="1341" y2="796" stroke="#C9C2D6" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="214" cy="780" r="11" fill="#E9B23A"/><text x="214" y="785" text-anchor="middle" class="num">10</text>
  <text x="234" y="785" class="lab">The dashboard reads the transcript with a Query (a Worker answers it)</text>

  <!-- footer -->
  <text x="48" y="856" class="ok">If the Worker dies between any two steps, a fresh Worker replays the Event History and continues</text>
  <text x="48" y="880" class="ok">from the last recorded result. A completed model call is not run again.</text>
  <text x="48" y="914" class="note">While the Workflow waits (step 9), no Worker holds it, so the wait can last minutes or days.</text>
</svg>
