<svg viewBox="0 0 1000 260" role="img" aria-label="The invoke role: Temporal&#x27;s Worker Controller accounts may assume it only with the External ID you chose; it allows InvokeAgentRuntime and GetAgentRuntimeEndpoint on this runtime and nothing else. The Worker Deployment Version in Temporal Cloud stores the endpoint ARN, role ARN and External ID." xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;background:#FFFFFF;border-radius:10px"><defs><marker id="kv2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5B68"/></marker><marker id="kv2i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B3FD1"/></marker><marker id="kv2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2412D"/></marker><marker id="kv2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0610A"/></marker><marker id="kv2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9C3DC"/></marker><marker id="kv2n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker></defs><rect x="12" y="12" width="628" height="236" rx="14" fill="none" stroke="#5F5B68" stroke-width="1.6" stroke-dasharray="6 5"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#5F5B68" text-anchor="start">YOUR AWS ACCOUNT</text><rect x="30" y="48" width="230" height="92" rx="10" fill="#FFF4E5" stroke="#B0610A" stroke-width="1.6"/><text x="42" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#1C1526" text-anchor="start">AgentCore runtime</text><text x="42" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5B68" text-anchor="start">endpoint DEFAULT</text><text x="42" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5B68" text-anchor="start">boots a microVM per</text><text x="42" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5B68" text-anchor="start">new runtime session</text><rect x="30" y="152" width="230" height="82" rx="10" fill="#FBF0DC" stroke="#9A5A00" stroke-width="1.6"/><text x="42" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#1C1526" text-anchor="start">Nothing else</text><text x="42" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5B68" text-anchor="start">no Bedrock, no S3, no</text><text x="42" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5B68" text-anchor="start">network path into a VM</text><rect x="300" y="48" width="322" height="186" rx="12" fill="#FFF4E5" stroke="#B0610A" stroke-width="1.6"/><text x="314" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#1C1526" text-anchor="start">IAM role (CloudFormation stack)</text><text x="314" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="start">Temporal-Cloud-Serverless-Worker-...-invoke</text><text x="314" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="start">Trust: sts:AssumeRole from Temporal&#x27;s</text><text x="314" y="133" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="start">Worker Controller accounts, only with</text><text x="314" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" fill="#1C1526" text-anchor="start">sts:ExternalId = &lt;your-external-id&gt;</text><text x="314" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="start">Allow, on this runtime only:</text><text x="314" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#1C1526" text-anchor="start">bedrock-agentcore:InvokeAgentRuntime</text><text x="314" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#1C1526" text-anchor="start">bedrock-agentcore:GetAgentRuntimeEndpoint</text><line x1="298" y1="94" x2="262" y2="94" stroke="#B0610A" stroke-width="1.8" marker-end="url(#kv2a)"/><rect x="680" y="12" width="308" height="236" rx="14" fill="#141020" stroke="#4A4360" stroke-width="1.6"/><text x="696" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#F2F0F7" text-anchor="start">Temporal Cloud</text><rect x="696" y="56" width="276" height="96" rx="10" fill="none" stroke="#4A4360" stroke-width="1.6"/><text x="708" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#F2F0F7" text-anchor="start">Worker Deployment Version</text><text x="708" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C9C3DC" text-anchor="start">compute provider: aws-agentcore</text><text x="708" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C9C3DC" text-anchor="start">endpoint ARN, role ARN,</text><text x="708" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C9C3DC" text-anchor="start">External ID (must match the trust)</text><text x="696" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C9C3DC" text-anchor="start">The Worker Controller Instance uses these</text><text x="696" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C9C3DC" text-anchor="start">three values: AssumeRole, then</text><text x="696" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C9C3DC" text-anchor="start">InvokeAgentRuntime on the endpoint.</text><line x1="694" y1="120" x2="626" y2="120" stroke="#B0610A" stroke-width="1.8" marker-end="url(#kv2a)"/></svg>