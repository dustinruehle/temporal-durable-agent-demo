<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 530" role="img" aria-label="Sequence: a client sends Signal-With-Start; Temporal Cloud has a Workflow Task with no Worker; the Worker Controller Instance assumes the invoke role and calls InvokeAgentRuntime; AgentCore boots a microVM whose Worker polls, runs the turn, records results, drains after the debounce window and returns." xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;background:#FFFFFF;border-radius:10px"><defs><marker id="kv1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5B68"/></marker><marker id="kv1i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B3FD1"/></marker><marker id="kv1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2412D"/></marker><marker id="kv1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0610A"/></marker><marker id="kv1w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9C3DC"/></marker><marker id="kv1n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker></defs><rect x="15" y="14" width="190" height="34" rx="8" fill="#4B3FD1" opacity="0.12" stroke="#4B3FD1"/><text x="110" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#4B3FD1" text-anchor="middle">Client or gateway</text><line x1="110" y1="50" x2="110" y2="520" stroke="#DCD8E0" stroke-width="2"/><rect x="265" y="14" width="190" height="34" rx="8" fill="#B0610A" opacity="0.12" stroke="#B0610A"/><text x="360" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#B0610A" text-anchor="middle">AWS: IAM + AgentCore</text><line x1="360" y1="50" x2="360" y2="520" stroke="#DCD8E0" stroke-width="2"/><rect x="495" y="14" width="190" height="34" rx="8" fill="#1F7A4D" opacity="0.12" stroke="#1F7A4D"/><text x="590" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1F7A4D" text-anchor="middle">microVM: Worker</text><line x1="590" y1="50" x2="590" y2="520" stroke="#DCD8E0" stroke-width="2"/><rect x="755" y="14" width="190" height="34" rx="8" fill="#141020" opacity="0.12" stroke="#141020"/><text x="850" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1C1526" text-anchor="middle">Temporal Cloud</text><line x1="850" y1="50" x2="850" y2="520" stroke="#DCD8E0" stroke-width="2"/><line x1="116" y1="80" x2="844" y2="80" stroke="#4B3FD1" stroke-width="1.8" marker-end="url(#kv1i)"/><text x="480.0" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">1. Signal-With-Start: new session, first message</text><rect x="692" y="96" width="300" height="26" rx="6" fill="#F7F6F3" stroke="#DCD8E0"/><text x="842" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">2. Workflow Task on agent-session; no Worker polls</text><line x1="844" y1="150" x2="366" y2="150" stroke="#B0610A" stroke-width="1.8" marker-end="url(#kv1a)"/><text x="605.0" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">3. WCI assumes the invoke role (External ID)</text><line x1="844" y1="186" x2="366" y2="186" stroke="#B0610A" stroke-width="1.8" marker-end="url(#kv1a)"/><text x="605.0" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">4. InvokeAgentRuntime, payload with no message</text><line x1="366" y1="222" x2="584" y2="222" stroke="#B0610A" stroke-width="1.8" marker-end="url(#kv1a)"/><text x="475.0" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">5. AgentCore boots a microVM</text><line x1="596" y1="258" x2="844" y2="258" stroke="#1F7A4D" stroke-width="1.8" marker-end="url(#kv1n)"/><text x="720.0" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">6. The Worker connects and polls (versioned)</text><line x1="844" y1="294" x2="596" y2="294" stroke="#4B3FD1" stroke-width="1.8" marker-end="url(#kv1i)"/><text x="720.0" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">7. Tasks: model call, skills, reply</text><line x1="596" y1="330" x2="844" y2="330" stroke="#1F7A4D" stroke-width="1.8" marker-end="url(#kv1n)"/><text x="720.0" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">8. Results recorded in Event History</text><rect x="440" y="356" width="300" height="26" rx="6" fill="#F7F6F3" stroke="#DCD8E0"/><text x="590" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">9. Idle for the debounce window: drain, return</text><rect x="210" y="394" width="300" height="26" rx="6" fill="#F7F6F3" stroke="#DCD8E0"/><text x="360" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1C1526" text-anchor="middle">10. Invocation completed; the microVM idles out</text><rect x="40" y="450" width="920" height="66" rx="10" fill="#E5F3EB" stroke="#1F7A4D" stroke-width="1.6"/><text x="56" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1F7A4D" text-anchor="start">Between turns no Worker polls and no microVM is busy; an idle microVM lives until AgentCore&#x27;s idle timeout.</text><text x="56" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1C1526" text-anchor="start">The session waits in Temporal Cloud. The next task (a message, a Timer, a Signal) starts again at step 2.</text><text x="56" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1C1526" text-anchor="start">Steps 3 to 6 are the cold start: about 7 s to the first reply on this path; about 10 s from a Timer to the Worker.</text></svg>