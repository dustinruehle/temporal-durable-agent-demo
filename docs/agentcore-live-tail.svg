<svg viewBox="0 0 1000 456" role="img" aria-label="Diagram of CloudWatch Live Tail on the runtime&#x27;s log group with the filter Invocation: Invocation completed at 11:54:29 after the first turn, 76 seconds with no invocation, then Invocation completed at 11:56:06 for the follow-up sent when the Timer fired." xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;background:#FFFFFF;border-radius:10px"><rect x="0" y="0" width="1000" height="44" fill="#232F3E"/><text x="20" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#FF9900" text-anchor="start">aws</text><text x="70" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">CloudWatch  &gt;  Live Tail</text><text x="20" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5F6B7A" text-anchor="start">Log group</text><rect x="20" y="82" width="600" height="30" rx="4" fill="#FFFFFF" stroke="#7D8998"/><text x="30" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#16191F" text-anchor="start">/aws/bedrock-agentcore/runtimes/&lt;runtime-id&gt;-DEFAULT</text><text x="640" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5F6B7A" text-anchor="start">Filter pattern</text><rect x="640" y="82" width="200" height="30" rx="4" fill="#FFFFFF" stroke="#7D8998"/><text x="650" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#16191F" text-anchor="start">Invocation</text><rect x="856" y="82" width="124" height="30" rx="15" fill="#FF9900"/><text x="918" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#16191F" text-anchor="middle">Start</text><rect x="20" y="128" width="960" height="210" rx="6" fill="#0F1B2A"/><text x="36" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#7D8998" text-anchor="start">11:54:29</text><text x="110" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#5FD38A" text-anchor="start">{&quot;level&quot;: &quot;INFO&quot;, &quot;message&quot;: &quot;Invocation completed successfully (21.771s)&quot;, ...}</text><text x="36" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#7D8998" text-anchor="start"></text><text x="110" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#9BA7B6" text-anchor="start">   started 11:54:07: Temporal invoked the runtime for the first turn; it drained 15 s after the turn</text><text x="36" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#7D8998" text-anchor="start"></text><text x="110" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#7D8998" text-anchor="start">   ... 76 seconds with no invocation: no Worker is running ...</text><text x="36" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#7D8998" text-anchor="start">11:56:06</text><text x="110" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#5FD38A" text-anchor="start">{&quot;level&quot;: &quot;INFO&quot;, &quot;message&quot;: &quot;Invocation completed successfully (21.397s)&quot;, ...}</text><text x="36" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#7D8998" text-anchor="start"></text><text x="110" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#9BA7B6" text-anchor="start">   started 11:55:45, when the Timer fired: Temporal invoked the runtime again to send the follow-up</text><text x="20" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1C1526" text-anchor="start">Filter on Invocation. A line prints when an invocation ends, about 20 s after the script&#x27;s PASS; its start is the</text><text x="20" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1C1526" text-anchor="start">completion time minus the duration. Keep Live Tail rolling about 25 s after PASS.</text><text x="20" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C2412D" text-anchor="start">Do not use boot lines as proof: AgentCore boots microVMs that never receive an invocation (about ten</text><text x="20" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#C2412D" text-anchor="start">around this run), and the Timer&#x27;s invocation landed on a microVM booted two minutes earlier.</text><text x="20" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5B68" text-anchor="start" font-style="italic">Diagram of Live Tail. The two log lines are real output from a live follow-up run; the grey notes are added for reading.</text></svg>